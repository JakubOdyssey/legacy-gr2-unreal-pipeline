name: Synthetic validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      REQUIRE_UFBX: '1'
      UFBX_AUDIT: .local/reader-build/ufbx_audit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Guard the clean public workspace
        run: python -B tools/publication_guard.py
      - name: Install reviewed schema dependencies
        run: python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Build pinned independent reader from public source
        run: python -B tools/build_reader.py
      - name: Check reproducible synthetic data
        run: python -B -m tests.synthetic.generate --check
      - name: Validate the neutral schema and invariants
        run: python -B -m tools.legacy_pipeline validate-neutral examples/synthetic_asset/neutral.json
      - name: Unit, deterministic export and independent round-trip tests
        run: python -B -m unittest discover -s tests/unit -v
      - name: Verify tracked content was not rewritten
        run: git diff --exit-code
      - name: Guard every tracked index blob
        run: python -B tools/publication_guard.py --staged
